<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="全媒刷题">
<meta name="theme-color" content="#1677FF">
<title>全媒体运营师 · 刷题</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231677FF'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>📱</text></svg>">
<style>
:root {
  --blue:#1677FF; --blue-light:#E6F4FF; --green:#52C41A; --green-bg:#F0FFF0;
  --red:#FF4D4F; --red-bg:#FFF1F0; --orange:#FA8C16; --orange-bg:#FFF7E6;
  --purple:#722ED1; --purple-bg:#F9F0FF; --bg:#F5F5F5; --card:#FFF;
  --text:#1A1A1A; --text2:#999; --sep:#E8E8E8; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;min-height:100vh}
.hidden{display:none!important}

/* Header */
.header{background:var(--card);padding:16px 20px;text-align:center;border-bottom:1px solid var(--sep);position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:700}
.header .sub{font-size:12px;color:var(--text2);margin-top:2px}

/* Tabs */
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto}
.tab{flex-shrink:0;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;background:var(--card);color:var(--text2);border:1px solid var(--sep);cursor:pointer;transition:.2s;white-space:nowrap}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Stats */
.stats{display:flex;align-items:center;gap:10px;padding:0 16px 12px;font-size:13px;color:var(--text2)}
.stats .score{color:var(--green);font-weight:700;font-size:16px}
.stats .wrong{color:var(--red);font-size:12px}
.progress-bar{flex:1;height:6px;background:var(--sep);border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--blue);border-radius:3px;transition:.3s}
.tool-btn{font-size:11px;padding:5px 12px;border-radius:14px;border:1px solid var(--sep);background:var(--card);cursor:pointer;font-weight:600}
.tool-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tool-btn.home-btn{background:var(--blue-light);color:var(--blue);border-color:var(--blue);font-weight:700}
.tool-btn.wrong-btn{background:var(--red-bg);color:var(--red);border-color:var(--red);font-weight:700}

/* Card */
.card{background:var(--card);border-radius:var(--radius);margin:0 16px 16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;margin-bottom:10px}
.badge-judge{background:var(--blue-light);color:var(--blue)}
.badge-single{background:var(--orange-bg);color:var(--orange)}
.badge-multi{background:var(--purple-bg);color:var(--purple)}

.q-num{font-size:12px;color:var(--text2);margin-bottom:8px;display:block}
.q-text{font-size:17px;line-height:1.7;font-weight:500;margin-bottom:20px;display:block}

/* Options */
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--sep);background:var(--card);font-size:15px;text-align:left;cursor:pointer;transition:.15s;font-family:inherit}
.opt-btn:hover{background:#FAFAFA}
.opt-btn:active{transform:scale(.98)}
.opt-label{width:32px;height:32px;border-radius:50%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;transition:.2s}
.opt-text{flex:1}

/* Judge buttons */
.judge-btns{display:flex;gap:12px}
.judge-btn{flex:1;padding:18px;border-radius:14px;font-size:20px;font-weight:700;border:none;cursor:pointer;transition:.15s;font-family:inherit;color:#fff}
.judge-btn:active{transform:scale(.96)}
.judge-true{background:var(--green)}
.judge-false{background:var(--red)}

/* Submit */
.submit-btn{width:100%;padding:14px;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;border:none;cursor:pointer;margin-top:12px;font-family:inherit}
.submit-btn:disabled{background:#CCC;cursor:not-allowed}

/* Answer states */
.opt-btn.correct,.opt-btn.reveal{border-color:var(--green);background:var(--green-bg);border-width:2.5px}
.opt-btn.correct .opt-label,.opt-btn.reveal .opt-label{background:var(--green);color:#fff}
.opt-btn.reveal::after{content:' ✓';color:var(--green);font-weight:900;font-size:18px;margin-left:auto}
.opt-btn.wrong{border-color:var(--red);background:var(--red-bg);border-width:2.5px}
.opt-btn.wrong .opt-label{background:var(--red);color:#fff}
.opt-btn.wrong::after{content:' ✗';color:var(--red);font-weight:900;font-size:18px;margin-left:auto}
.opt-btn.selected{border-color:var(--blue);background:var(--blue-light)}
.opt-btn.selected .opt-label{background:var(--blue);color:#fff}
.judge-btn.highlight{outline:3px solid var(--blue);outline-offset:2px}
.judge-btn.faded{opacity:.4}

/* Explanation */
.explanation{margin-top:16px;padding:16px;border-radius:12px;background:var(--orange-bg);border:1px solid #FFE0A0;font-size:14px;line-height:1.6;animation:slideUp .3s}
.exp-label{font-weight:700;font-size:12px;color:var(--orange);margin-bottom:4px}
.exp-answer{font-weight:700;color:var(--green);margin-bottom:6px}
.next-btn{width:100%;padding:12px;border-radius:10px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:12px;font-family:inherit}

@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Dashboard */
.dash-row{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.dash-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dash-title{font-weight:700;font-size:15px}
.dash-stat{font-size:12px;color:var(--text2)}
.dash-bar{height:6px;background:#E8E8E8;border-radius:3px;overflow:hidden;margin-bottom:10px}
.dash-actions{display:flex;gap:8px;flex-wrap:wrap}
.dash-btn{padding:7px 14px;border-radius:16px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.dash-btn.primary{background:var(--blue);color:#fff}
.dash-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--sep)}
.dash-btn.warn{background:var(--red);color:#fff}

/* Complete */
.complete{text-align:center;padding:60px 20px}
.complete .icon{font-size:60px;margin-bottom:16px}
.complete h2{font-size:22px;margin-bottom:12px}
.complete p{font-size:14px;line-height:1.8;color:var(--text2)}
.rate-big{font-size:48px;font-weight:700;color:var(--green);margin:12px 0}
.act-btn{display:block;width:260px;margin:8px auto;padding:16px;border-radius:12px;font-size:16px;font-weight:700;border:none;cursor:pointer;font-family:inherit;color:#fff}
.act-btn.primary{background:var(--blue)}
.act-btn.warn{background:var(--orange)}
.act-btn.danger{background:var(--red)}
.act-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--sep)}

/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:8px 22px;border-radius:20px;font-size:14px;font-weight:700;color:#fff;z-index:200;pointer-events:none;animation:fadeIn .3s;background:var(--green);white-space:nowrap}
.toast.err{background:var(--red)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}}

/* Jump dialog */
.jump-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:center;justify-content:center}
.jump-dialog{background:var(--card);border-radius:16px;padding:24px;width:280px;text-align:center}
.jump-dialog h3{margin-bottom:4px;font-size:18px}
.jump-dialog p{font-size:13px;color:var(--text2);margin-bottom:12px}
.jump-dialog input{width:100%;padding:10px;border-radius:10px;border:2px solid var(--sep);font-size:20px;text-align:center;font-weight:700;margin-bottom:14px;font-family:inherit;outline:none}
.jump-dialog input:focus{border-color:var(--blue)}
.jump-dialog .jump-actions{display:flex;gap:8px}
.jump-dialog button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.jump-dialog .jump-cancel{background:var(--sep);color:var(--text)}
.jump-dialog .jump-go{background:var(--blue);color:#fff}

/* Wrong badge */
.wrong-badge{background:var(--red);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:4px}
</style>
</head>
<body>

<div class="header"><h1>📱 全媒体运营师 · 刷题</h1><div class="sub">全媒体运营师（流量运营）三级理论知识</div></div>

<div class="tabs" id="tabs">
  <button class="tab active" data-mode="all">全部 1625</button>
  <button class="tab" data-mode="judge">判断题 (485)</button>
  <button class="tab" data-mode="single">单选题 (650)</button>
  <button class="tab" data-mode="multi">多选题 (490)</button>
</div>

<div class="stats">
  <span id="progressTxt">第 1/1625 题</span>
  <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
  <span class="score" id="scoreTxt">0%</span>
  <span class="wrong" id="wrongTxt"></span>
  <button class="tool-btn home-btn" onclick="renderDashboard()">🏠 首页</button>
  <button class="tool-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀 乱序</button>
  <button class="tool-btn" onclick="showJump()">⏭ 跳转</button>
  <button class="tool-btn wrong-btn" id="wrongBookBtn" onclick="openWrongBook()">📋 错题<span class="wrong-badge" id="wrongBadge">0</span></button>
</div>

<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script src="quanmeiti_bank.js"></script>
<script>
// ── Init ──
let bank, questions=[], currentIdx=0, correct=0, wrong=0, answered=false;
let shuffleMode=false, currentMode='all', wrongBook=[], inReview=false, sessionWrong=[];

function init(){
  try{
    bank = window.QUIZ_BANK;
    if(!bank || !bank.questions) throw new Error('题库未加载');
    wrongBook = JSON.parse(localStorage.wrongBook||'[]');
    updateWrongBadge();
    renderDashboard();
  }catch(e){ app.innerHTML='<div class="complete"><div class="icon">⚠️</div><h2>加载失败</h2><p>'+e.message+'</p></div>'; }
}

function getTypeLabel(t){return {judge:'判断题',single:'单选题',multi:'多选题'}[t]||''}
function getModeLabel(m){return {all:'全部',judge:'判断题',single:'单选题',multi:'多选题'}[m]||'全部'}
function getModeCount(m){return {all:1625,judge:485,single:650,multi:490}[m]||1625}

// ── Dashboard ──
function renderDashboard(){
  const modes=[{key:'all',icon:'📚',title:'全部',color:'#1677FF'},{key:'judge',icon:'📝',title:'判断题',color:'#52C41A'},{key:'single',icon:'📋',title:'单选题',color:'#FA8C16'},{key:'multi',icon:'📑',title:'多选题',color:'#722ED1'}];
  let rows='';
  for(const m of modes){
    const total=getModeCount(m.key);
    const p=loadProgress(m.key);
    const done=p.c+p.w, pct=Math.round(done/total*100), rate=done?Math.round(p.c/done*100):0;
    rows+=`<div class="dash-row"><div class="dash-header"><span class="dash-title">${m.icon} ${m.title}</span><span class="dash-stat">${done?`正确 <b style="color:var(--green)">${p.c}</b> · 错误 <b style="color:var(--red)">${p.w}</b> · 正确率 <b>${rate}%</b>`:'尚未开始'}</span></div>
    <div class="dash-bar"><div class="dash-bar-fill" style="width:${pct}%;background:${m.color}"></div></div>
    <div class="dash-actions">
    <button class="dash-btn primary" onclick="resetAndStart('${m.key}')">▶ ${done&&done<total?'继续 ('+(done)+'/'+total+')':'开始刷题'}</button>
    ${done&&done<total?`<button class="dash-btn secondary" onclick="resetAndStart('${m.key}')">🆕 重刷</button>`:''}
    </div></div>`;
  }
  const wb=wrongBook.length;
  app.innerHTML=`<div class="card" style="text-align:center;margin-bottom:8px"><h2>📊 刷题进度</h2><p style="font-size:13px;color:var(--text2)">选择一种题型开始刷题，或继续之前的进度</p></div>
  <div style="padding:0 16px">${rows}
  ${wb?`<div class="dash-row" style="text-align:center"><span style="font-size:15px;font-weight:700">📋 错题本：<b style="color:var(--red)">${wb}</b> 题待复习</span>
  <div class="dash-actions" style="justify-content:center;margin-top:6px"><button class="dash-btn warn" onclick="openWrongBook()">复习错题</button></div></div>`:`<div class="dash-row" style="text-align:center;opacity:.6"><span style="font-size:15px;color:var(--text2)">📋 错题本为空</span></div>`}
  </div>`;
}

function loadProgress(mode){
  try{const d=JSON.parse(localStorage.progress||'{}');return d[mode]||{i:0,c:0,w:0}}catch(e){return{i:0,c:0,w:0}}
}
function saveProgress(mode,idx,c,w){
  if(inReview||mode==='wrongbook')return;
  const d=JSON.parse(localStorage.progress||'{}');
  d[mode]={i:idx,c,w}; localStorage.progress=JSON.stringify(d);
}

function resetAndStart(mode){
  currentMode=mode; shuffleMode=false;
  document.getElementById('shuffleBtn').classList.remove('on');
  let qs=bank.questions.slice();
  if(mode!=='all') qs=qs.filter(q=>q.type===mode);
  const p=loadProgress(mode);
  questions=qs; currentIdx=p.i; correct=p.c; wrong=p.w; answered=false; sessionWrong=[]; inReview=false;
  updateStats(); render();
  window.scrollTo(0,0);
}

// ── Shuffle ──
function toggleShuffle(){
  shuffleMode=!shuffleMode;
  document.getElementById('shuffleBtn').classList.toggle('on',shuffleMode);
  let qs=bank.questions.slice();
  if(currentMode!=='all') qs=qs.filter(q=>q.type===currentMode);
  if(shuffleMode) qs=shuffleFisherYates(qs.slice());
  questions=qs; currentIdx=0; correct=0; wrong=0; sessionWrong=[]; answered=false;
  updateStats(); render(); window.scrollTo(0,0);
}
function shuffleFisherYates(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ── Mode tabs ──
document.getElementById('tabs').addEventListener('click',e=>{
  if(!e.target.classList.contains('tab'))return;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentMode=e.target.dataset.mode;
  let qs=bank.questions.slice();
  if(currentMode!=='all') qs=qs.filter(q=>q.type===currentMode);
  questions=qs; currentIdx=0; correct=0; wrong=0; sessionWrong=[]; answered=false; shuffleMode=false;
  document.getElementById('shuffleBtn').classList.remove('on');
  updateStats(); render(); window.scrollTo(0,0);
});

// ── Render question ──
function render(){
  if(currentIdx>=questions.length){renderComplete();return}
  const q=questions[currentIdx]; answered=false; updateStats();
  let h='';
  const badgeCls='badge-'+(q.type==='judge'?'judge':q.type==='single'?'single':'multi');
  if(q.type==='judge'){
    h=`<div class="card"><span class="badge ${badgeCls}">判断题</span><span class="q-num">第 ${q.number} 题</span><span class="q-text">${q.question}</span>
    <div class="judge-btns"><button class="judge-btn judge-true" onclick="answerJudge('正确',this)">✓ 正确</button>
    <button class="judge-btn judge-false" onclick="answerJudge('错误',this)">✗ 错误</button></div><div id="expArea"></div></div>`;
  }else if(q.type==='single'){
    let opts='';
    (q.options||[]).forEach(o=>{opts+=`<button class="opt-btn" onclick="answerSingle('${o.label}',this)"><span class="opt-label">${o.label}</span><span class="opt-text">${o.text}</span></button>`});
    h=`<div class="card"><span class="badge ${badgeCls}">单选题</span><span class="q-num">第 ${q.number} 题</span><span class="q-text">${q.question}</span><div class="options">${opts}</div><div id="expArea"></div></div>`;
  }else{
    let opts='';
    (q.options||[]).forEach(o=>{opts+=`<button class="opt-btn" onclick="toggleMulti(this)" data-label="${o.label}"><span class="opt-label">${o.label}</span><span class="opt-text">${o.text}</span></button>`});
    h=`<div class="card"><span class="badge ${badgeCls}">多选题</span><span class="q-num">第 ${q.number} 题</span><span class="q-text">${q.question}</span><div class="options">${opts}</div>
    <button class="submit-btn" id="multiSubmit" onclick="submitMulti()" disabled>请选择答案</button><div id="expArea"></div></div>`;
  }
  app.innerHTML=h; selectedMulti.clear();
}

function updateStats(){
  const total=questions.length, done=correct+wrong;
  document.getElementById('progressTxt').textContent=total?`第 ${Math.min(done+1,total)}/${total} 题`:'0/0';
  document.getElementById('progressFill').style.width=total?`${Math.min(done/total*100,100)}%`:'0%';
  const rate=done?Math.round(correct/done*100):0;
  document.getElementById('scoreTxt').textContent=rate+'%';
  document.getElementById('wrongTxt').textContent=wrong?`错${wrong}`:'';
}

// ── Judge ──
function answerJudge(userAns,btn){
  if(answered)return; answered=true;
  const q=questions[currentIdx], correctAns=q.answer==='√'?'正确':'错误', isCorrect=userAns===correctAns;
  document.querySelectorAll('.judge-btn').forEach(b=>{b.style.pointerEvents='none';if(b.textContent.includes(correctAns))b.classList.add('highlight');if(b===btn&&!isCorrect)b.classList.add('faded')});
  if(isCorrect)onCorrect(q); else onWrong(q,correctAns);
}

// ── Single ──
function answerSingle(label,btn){
  if(answered)return; answered=true;
  const q=questions[currentIdx], isCorrect=label===q.answer;
  document.querySelectorAll('.opt-btn').forEach(b=>{b.style.pointerEvents='none';if(b.dataset?.label===q.answer)b.classList.add('reveal')});
  if(isCorrect){btn.classList.add('correct');onCorrect(q)}else{btn.classList.add('wrong');onWrong(q,q.answer)}
}

// ── Multi ──
let selectedMulti=new Set();
function toggleMulti(btn){
  if(answered)return;
  const label=btn.dataset.label;
  if(selectedMulti.has(label)){selectedMulti.delete(label);btn.classList.remove('selected')}
  else{selectedMulti.add(label);btn.classList.add('selected')}
  document.getElementById('multiSubmit').disabled=selectedMulti.size===0;
  document.getElementById('multiSubmit').textContent=selectedMulti.size?`确认提交 (${selectedMulti.size} 项)`:'请选择答案';
}
function submitMulti(){
  if(answered||selectedMulti.size===0)return; answered=true;
  const q=questions[currentIdx], userAns=[...selectedMulti].sort().join(''), isCorrect=userAns===q.answer;
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.style.pointerEvents='none';
    const lbl=b.dataset.label;
    // 正确答案 → 绿色
    if(q.answer.includes(lbl)) b.classList.add('reveal');
    // 用户选了但非正确答案 → 红色
    if(selectedMulti.has(lbl)&&!q.answer.includes(lbl)) b.classList.add('wrong');
  });
  document.getElementById('multiSubmit').disabled=true;
  if(isCorrect)onCorrect(q); else onWrong(q,q.answer);
}

// ── Answer handling ──
function onCorrect(q){
  correct++; removeFromWrongBook(q.id); updateStats(); saveProgress(currentMode,currentIdx,correct,wrong); showToast('✓ 正确！');
  setTimeout(()=>{currentIdx++;answered=false;if(currentIdx>=questions.length)renderComplete();else{render();window.scrollTo(0,0);}},700);
}
function onWrong(q,correctAns){
  wrong++; sessionWrong.push(q.id); addToWrongBook(q.id); updateStats(); saveProgress(currentMode,currentIdx,correct,wrong); showToast('✗ 错误',true);
  // show explanation
  let ansDisplay=correctAns;
  if(q.type==='single'){const o=q.options?.find(o=>o.label===correctAns);if(o)ansDisplay=correctAns+'. '+o.text}
  else if(q.type==='multi'){ansDisplay=correctAns.split('').map(l=>{const o=q.options?.find(o2=>o2.label===l);return l+(o?'. '+o.text:'')}).join('；')}
  document.getElementById('expArea').innerHTML=`<div class="explanation"><div class="exp-label">📖 解析</div><div class="exp-answer">✅ 正确答案：${ansDisplay}</div><div>${q.explanation||'暂无解析'}</div><button class="next-btn" onclick="goNext()">下一题 →</button></div>`;
  document.getElementById('expArea').scrollIntoView({behavior:'smooth',block:'center'});
}
function goNext(){currentIdx++;answered=false;if(currentIdx>=questions.length)renderComplete();else{render();window.scrollTo(0,0)}}

// ── Toast ──
let toastTimer;
function showToast(msg,isErr){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(isErr?' err':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),1200)}

// ── Wrong book ──
function addToWrongBook(qid){if(!wrongBook.includes(qid)){wrongBook.push(qid);localStorage.wrongBook=JSON.stringify(wrongBook);updateWrongBadge()}}
function removeFromWrongBook(qid){const i=wrongBook.indexOf(qid);if(i>=0){wrongBook.splice(i,1);localStorage.wrongBook=JSON.stringify(wrongBook);updateWrongBadge()}}
function updateWrongBadge(){const c=wrongBook.length;document.getElementById('wrongBadge').textContent=c}
function openWrongBook(){
  if(!wrongBook.length){showToast('错题本为空 🎉');return}
  inReview=true; questions=bank.questions.filter(q=>wrongBook.includes(q.id)); currentIdx=0; correct=0; wrong=0; sessionWrong=[]; answered=false;
  updateStats(); render(); window.scrollTo(0,0);
}

// ── Complete ──
function renderComplete(){
  const total=questions.length, rate=total?Math.round(correct/total*100):0;
  let emoji='🎉'; if(rate>=90)emoji='🏆'; else if(rate>=70)emoji='👍'; else if(rate<50)emoji='💪';
  const sw=sessionWrong.length, wb=wrongBook.length;
  let actions=`<button class="act-btn primary" onclick="restart()">🔄 重新开始（${getModeLabel(currentMode)}）</button>`;
  if(sw) actions+=`<button class="act-btn warn" onclick="reviewSessionWrong()">🔍 复习本轮错题 (${sw})</button>`;
  if(wb) actions+=`<button class="act-btn danger" onclick="openWrongBook()">📋 错题本 (${wb}题)</button>`;
  actions+=`<button class="act-btn secondary" onclick="renderDashboard()">🏠 返回首页</button>`;
  app.innerHTML=`<div class="complete"><div class="icon">${emoji}</div><h2>本轮完成！</h2>
  <p>正确：<b>${correct}</b> 题 | 错误：<b>${wrong}</b> 题</p><div class="rate-big">${rate}%</div>
  <p style="font-size:13px">📋 错题本累计：<b>${wrongBook.length}</b> 题</p>${actions}</div>`;
  if(!inReview){const d=JSON.parse(localStorage.progress||'{}');d[currentMode]={i:0,c:0,w:0};localStorage.progress=JSON.stringify(d)}
}
function reviewSessionWrong(){
  inReview=true; questions=bank.questions.filter(q=>sessionWrong.includes(q.id)); currentIdx=0; correct=0; wrong=0; sessionWrong=[]; answered=false;
  updateStats(); render(); window.scrollTo(0,0);
}
function restart(){
  let qs=bank.questions.slice(); if(currentMode!=='all') qs=qs.filter(q=>q.type===currentMode);
  if(shuffleMode) qs=shuffleFisherYates(qs.slice());
  questions=qs; currentIdx=0; correct=0; wrong=0; sessionWrong=[]; answered=false; inReview=false;
  updateStats(); render(); window.scrollTo(0,0);
}

// ── Jump ──
function showJump(){
  const total=questions.length||getModeCount(currentMode);
  const cur=currentIdx+1;
  const el=document.createElement('div'); el.className='jump-overlay'; el.id='jumpOverlay';
  el.innerHTML=`<div class="jump-dialog"><h3>⏭ 跳转题目</h3><p>当前第 ${cur}/${total} 题</p>
  <input type="number" id="jumpInput" min="1" max="${total}" value="${cur}" onfocus="this.select()">
  <div class="jump-actions"><button class="jump-cancel" onclick="document.getElementById('jumpOverlay').remove()">取消</button>
  <button class="jump-go" onclick="doJump()">跳转</button></div></div>`;
  document.body.appendChild(el);
  setTimeout(()=>document.getElementById('jumpInput').focus(),100);
  el.addEventListener('click',e=>{if(e.target===el)el.remove()});
}
function doJump(){
  const n=parseInt(document.getElementById('jumpInput').value), total=questions.length;
  if(isNaN(n)||n<1) currentIdx=0; else if(n>total) currentIdx=total-1; else currentIdx=n-1;
  document.getElementById('jumpOverlay').remove();
  correct=0; wrong=0; sessionWrong=[]; answered=false; updateStats(); render(); window.scrollTo(0,0);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
