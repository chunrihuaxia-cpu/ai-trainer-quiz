<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PDF旋转</title><link rel="stylesheet" href="/css/style.css"></head><body>
<nav class="nav"><a href="/" class="nav-brand">PDFTool<span style="color:var(--green);font-size:11px;margin-left:4px">🔒 不上传</span></a><div class="nav-links"><a href="/" class="nav-link" data-i18n="nav.home"></a><button class="nav-lang" onclick="I18n.switch(I18n._lang==='zh'?'en':'zh')" data-i18n="nav.lang"></button></div></nav>
<div class="container">
  <a href="/" class="page-back">← <span data-i18n="nav.home"></span></a>
  <h1>🔄 PDF 旋转</h1><p style="color:var(--text2);margin-bottom:4px">旋转 PDF 页面方向</p>
  <p style="font-size:12px;color:var(--green);margin-bottom:24px">🔒 文件在浏览器本地处理，不上传服务器</p>
  <div class="upload-zone" id="upload"><span class="upload-icon">🔄</span><div class="upload-text">点击选择 PDF，或将文件拖拽到此处</div></div>
  <div id="preview" class="hidden" style="margin-top:16px">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap" id="pageList"></div>
    <button class="btn btn-primary" onclick="window._apply()">💾 下载旋转后的 PDF</button>
  </div>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/pdf-lib.min.js"></script>
<script type="module">
import { initUploadZone } from '/js/common.js';
let srcDoc=null,srcBytes=null,rotations={};

initUploadZone('upload',async([file])=>{
  const { PDFDocument }=PDFLib;
  srcBytes=await file.arrayBuffer();
  srcDoc=await PDFDocument.load(srcBytes,{ignoreEncryption:true});
  const n=srcDoc.getPageCount();
  document.getElementById('preview').classList.remove('hidden');
  document.getElementById('upload').style.opacity='0.5';
  let html='';
  for(let i=0;i<n;i++){
    rotations[i]=0;
    html+=`<div style="text-align:center;cursor:pointer;padding:8px 14px;border:1px solid var(--border);border-radius:8px;min-width:60px" onclick="window._rot(${i})">
      <div style="font-size:24px">📄</div>
      <div style="font-size:12px">第${i+1}页</div>
      <div style="font-size:11px;color:var(--primary);font-weight:600" id="deg${i}">0°</div>
    </div>`;
  }
  document.getElementById('pageList').innerHTML=html;
});
window._rot=(i)=>{rotations[i]=(rotations[i]+90)%360;document.getElementById('deg'+i).textContent=rotations[i]+'°';};
window._apply=async()=>{
  const { PDFDocument }=PDFLib;
  const out=await PDFDocument.create();
  const pages=await out.copyPages(srcDoc,srcDoc.getPageIndices());
  pages.forEach((p,i)=>{out.addPage(p);if(rotations[i])p.setRotation({angle:rotations[i]})});
  const data=await out.save();
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download='rotated.pdf';a.click();
};
</script>
</body></html>
