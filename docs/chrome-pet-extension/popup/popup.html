<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body{width:280px;padding:16px;font-family:-apple-system,sans-serif;margin:0;background:#fafafa}
h2{font-size:16px;margin:0 0 4px;text-align:center}
.sub{font-size:11px;color:#999;text-align:center;margin-bottom:12px}
.pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pet-card{text-align:center;padding:10px 6px;border-radius:12px;cursor:pointer;border:2px solid transparent;transition:.2s;background:#fff}
.pet-card:hover{border-color:#007AFF;background:#f0f7ff}
.pet-card.active{border-color:#007AFF;background:#e8f2ff}
.pet-emoji{font-size:32px;display:block}
.pet-name{font-size:11px;font-weight:600;margin-top:4px}
.stats{font-size:12px;color:#666;line-height:1.6;background:#fff;border-radius:10px;padding:10px;margin-bottom:8px}
.stats b{color:#007AFF}
.btn{display:block;width:100%;padding:8px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center}
.btn-primary{background:#007AFF;color:#fff}
.btn-secondary{background:#e8e8e8;color:#333;margin-top:6px}
.premium-banner{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:10px;padding:10px;text-align:center;margin-top:8px;font-size:12px}
.premium-banner a{color:#fff;font-weight:700}
</style></head><body>
<h2>🐾 Screen Buddy</h2>
<div class="sub">你的浏览器桌面宠物</div>

<div class="stats" id="stats">加载中…</div>

<div class="pet-grid" id="petGrid"></div>

<button class="btn btn-primary" id="feedBtn">🍪 喂食</button>
<div class="premium-banner">
  🔓 <a href="#" id="premiumLink">升级 Pro</a> — 解锁 10+ 宠物 + 番茄钟 + 云同步<br>$2.99/月
</div>
<button class="btn btn-secondary" id="resetBtn">重置位置</button>

<script src="popup.js"></script>
</body></html>
